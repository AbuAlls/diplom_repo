<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ИИ-Консультант — Web</title>
  <style>
/* ============================================================
   ИИ-Консультант — Web App design tokens
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap');

:root {
  /* brand accent (overridable by tweaks) */
  --accent-1: #7C3AED;
  --accent-2: #9333EA;
  --accent-3: #C026D3;
  --brand-grad: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 52%, var(--accent-3) 100%);
  --brand-soft: color-mix(in srgb, var(--accent-1) 12%, white);
  --brand-ink: var(--accent-1);

  /* semantic */
  --red: #EF4444;
  --amber: #F59E0B;
  --green: #22C55E;
  --indigo: #6366F1;

  /* radii & density */
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 32px;
  --gap: 22px;
  --pad-card: 22px;
  --sidebar-w: 264px;

  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---- Light theme (default) ---- */
:root, [data-theme="light"] {
  --bg: #F1F0FA;
  --bg-2: #E9E7F6;
  --surface: #FFFFFF;
  --surface-2: #F7F6FD;
  --surface-inset: #F2F1F9;
  --ink: #1C1830;
  --ink-2: #4A455F;
  --muted: #8C88A0;
  --muted-2: #A8A4BA;
  --line: #ECEAF4;
  --line-2: #E2DFF0;
  --shadow: 0 18px 40px -24px rgba(60, 30, 110, 0.30), 0 2px 8px -4px rgba(60, 30, 110, 0.10);
  --shadow-sm: 0 8px 20px -16px rgba(60, 30, 110, 0.35);
  --on-grad: rgba(255,255,255,0.92);
  --frost: rgba(255,255,255,0.22);
}

/* ---- Dark theme ---- */
[data-theme="dark"] {
  --bg: #110E1B;
  --bg-2: #171327;
  --surface: #1D1830;
  --surface-2: #241E3A;
  --surface-inset: #251F3B;
  --ink: #F4F2FB;
  --ink-2: #C5C0DA;
  --muted: #918CAB;
  --muted-2: #6F6A89;
  --line: #2B2542;
  --line-2: #342D4F;
  --shadow: 0 22px 50px -26px rgba(0, 0, 0, 0.7);
  --shadow-sm: 0 10px 24px -18px rgba(0, 0, 0, 0.7);
  --on-grad: rgba(255,255,255,0.94);
  --frost: rgba(255,255,255,0.16);
  --brand-soft: color-mix(in srgb, var(--accent-1) 26%, #1D1830);
  --brand-ink: color-mix(in srgb, var(--accent-1) 55%, white);
}

/* density */
[data-density="compact"] {
  --gap: 16px;
  --pad-card: 17px;
  --r-lg: 22px;
  --r-md: 15px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Golos Text', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  transition: background .35s ease, color .35s ease;
}

h1, h2, h3, h4, .display { font-family: 'Manrope', system-ui, sans-serif; }

#root { min-height: 100%; }

::selection { background: color-mix(in srgb, var(--accent-2) 30%, transparent); }

/* scrollbar */
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 20px; border: 3px solid var(--bg); }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Layout shell
   ============================================================ */
.app-shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 22px 16px;
  gap: 6px;
  z-index: 30;
  transition: background .35s ease, border-color .35s ease;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 8px 10px 18px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--brand-grad);
  display: grid; place-items: center; color: white;
  box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent-2) 70%, transparent);
  flex: none;
}
.brand-name { font-family: 'Manrope'; font-weight: 800; font-size: 16px; line-height: 1.1; letter-spacing: -.02em; }
.brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }

.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; color: var(--muted-2); text-transform: uppercase; padding: 16px 12px 7px; }

.nav-item {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 13px; border-radius: 13px;
  color: var(--ink-2); font-weight: 600; font-size: 14.5px;
  cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
  transition: background .16s ease, color .16s ease;
  position: relative;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-ink); }
.nav-item.active .nav-ico { color: var(--brand-ink); }
.nav-ico { color: var(--muted); flex: none; transition: color .16s; }
.nav-item .badge-dot { margin-left: auto; }

.side-user {
  margin-top: auto; display: flex; align-items: center; gap: 11px;
  padding: 11px; border-radius: 15px; background: var(--surface-2);
  cursor: pointer; border: 1px solid var(--line);
}
.side-user:hover { border-color: var(--line-2); }

/* Main column */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 18px 34px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.page-title { font-family: 'Manrope'; font-weight: 800; font-size: 23px; letter-spacing: -.02em; }
.page-sub { font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 1px; }

.search {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; padding: 10px 14px; min-width: 280px; color: var(--muted);
}
.search input { border: none; background: transparent; outline: none; color: var(--ink); font: inherit; width: 100%; }
.search input::placeholder { color: var(--muted-2); }

.content { padding: 28px 34px 56px; max-width: 1240px; width: 100%; }

/* ============================================================
   Primitives
   ============================================================ */
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: var(--pad-card);
  transition: background .35s ease, border-color .35s, transform .18s, box-shadow .18s;
}
.card.flat { box-shadow: none; }
.card.tap { cursor: pointer; }
.card.tap:hover { transform: translateY(-3px); box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent-2) 22%, transparent); }

.section-label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }

.icon-tile {
  width: 52px; height: 52px; border-radius: 15px; flex: none;
  display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand-ink);
}
.icon-tile.sm { width: 42px; height: 42px; border-radius: 12px; }
.icon-tile.lg { width: 62px; height: 62px; border-radius: 18px; }
.icon-tile.red { background: color-mix(in srgb, var(--red) 14%, var(--surface)); color: var(--red); }
.icon-tile.amber { background: color-mix(in srgb, var(--amber) 16%, var(--surface)); color: #D97706; }
.icon-tile.green { background: color-mix(in srgb, var(--green) 15%, var(--surface)); color: #15803D; }
.icon-tile.indigo { background: color-mix(in srgb, var(--indigo) 14%, var(--surface)); color: var(--indigo); }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; line-height: 1;
  background: var(--brand-soft); color: var(--brand-ink);
}
.badge.amber { background: color-mix(in srgb, var(--amber) 18%, var(--surface)); color: #B45309; }
.badge.red { background: color-mix(in srgb, var(--red) 14%, var(--surface)); color: #DC2626; }
.badge.green { background: color-mix(in srgb, var(--green) 16%, var(--surface)); color: #15803D; }
.badge.indigo { background: color-mix(in srgb, var(--indigo) 14%, var(--surface)); color: var(--indigo); }
.badge.ghost { background: var(--surface-inset); color: var(--ink-2); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--brand-soft); color: var(--brand-ink);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 11px 18px; border-radius: 13px; border: none;
  font-family: 'Manrope'; font-weight: 700; font-size: 14px; cursor: pointer;
  transition: transform .14s, box-shadow .18s, background .18s, opacity .18s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand-grad); color: white; box-shadow: 0 12px 24px -12px color-mix(in srgb, var(--accent-2) 80%, transparent); }
.btn-primary:hover { box-shadow: 0 16px 30px -12px color-mix(in srgb, var(--accent-2) 85%, transparent); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); box-shadow: var(--shadow-sm); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-soft { background: var(--brand-soft); color: var(--brand-ink); }
.btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 11px; }
.btn.icon { padding: 10px; width: 42px; height: 42px; }

.avatar {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  display: grid; place-items: center; color: white; font-family: 'Manrope';
  font-weight: 800; font-size: 15px; background: var(--brand-grad);
}
.avatar.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }

/* progress bar */
.track { height: 9px; border-radius: 999px; background: var(--surface-inset); overflow: hidden; }
.track .fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

/* gradient hero */
.hero {
  position: relative; overflow: hidden; color: white;
  background: var(--brand-grad);
  border-radius: var(--r-xl);
  padding: 30px 32px;
  box-shadow: 0 26px 50px -28px color-mix(in srgb, var(--accent-2) 85%, transparent);
}
.hero .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.13); pointer-events: none; }
.hero .blob.a { width: 230px; height: 230px; top: -90px; right: -40px; }
.hero .blob.b { width: 150px; height: 150px; bottom: -70px; right: 120px; background: rgba(255,255,255,.09); }
.hero .frost {
  width: 64px; height: 64px; border-radius: 18px; flex: none;
  background: var(--frost); backdrop-filter: blur(6px);
  display: grid; place-items: center; border: 1px solid rgba(255,255,255,.25);
}

/* grids */
.grid { display: grid; gap: var(--gap); }
.row { display: flex; gap: var(--gap); }
.stack { display: flex; flex-direction: column; gap: var(--gap); }

.stat-num { font-family: 'Manrope'; font-weight: 800; letter-spacing: -.03em; line-height: 1; }

/* list row */
.lrow {
  display: flex; align-items: center; gap: 15px; padding: 14px 0;
  border-top: 1px solid var(--line);
}
.lrow:first-child { border-top: none; }

/* fade/slide animation for view switches */
@keyframes viewIn { from { transform: translateY(9px); } to { transform: none; } }
.view { animation: viewIn .38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { opacity:0; transform: scale(.96) translateY(8px);} to {opacity:1; transform:none;} }

/* segmented */
.seg { display: inline-flex; background: var(--surface-inset); border-radius: 12px; padding: 4px; gap: 3px; }
.seg button { border: none; background: transparent; padding: 8px 15px; border-radius: 9px; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; transition: .15s; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* dropzone */
.dropzone {
  border: 2px dashed var(--line-2); border-radius: var(--r-lg);
  padding: 48px; text-align: center; background: var(--surface-2);
  transition: .2s; cursor: pointer;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent-2); background: var(--brand-soft); }

/* form fields */
.field { display: flex; flex-direction: column; gap: 7px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field-in { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 13px; padding: 12px 14px; transition: border-color .16s, box-shadow .16s; }
.field-in:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 14%, transparent); }
.field-in input { border: none; background: transparent; outline: none; font: inherit; color: var(--ink); width: 100%; }

@media (max-width: 820px) { .auth-brand { display: none !important; } div[style*="grid-template-columns: 1.05fr 1fr"] { grid-template-columns: 1fr !important; } }

/* status pill */
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(20,12,40,.5); backdrop-filter: blur(4px); z-index: 60; display: grid; place-items: center; padding: 24px; animation: viewIn .2s; }
.modal { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: var(--r-xl); box-shadow: 0 40px 90px -30px rgba(0,0,0,.5); animation: pop .28s cubic-bezier(.2,.8,.2,1); }

/* mobile */
.menu-btn { display: none; }
@media (max-width: 940px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .28s ease; width: 280px; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .search { min-width: 0; flex: 1; }
  .content { padding: 20px 18px 48px; }
  .topbar { padding: 14px 18px; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 25; }
}
@media (max-width: 560px) {
  .hide-sm { display: none !important; }
}

  </style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel" data-file="ui.jsx">
/* ui.jsx — shared UI primitives */
const { useState, useEffect, useRef } = React;

const Card = ({ className = '', tap, children, ...p }) => (
  <div className={`card ${tap ? 'tap' : ''} ${className}`} {...p}>{children}</div>
);

const SectionLabel = ({ children, style }) => (
  <div className="section-label" style={style}>{children}</div>
);

const IconTile = ({ icon, tint = '', size = '', s }) => (
  <div className={`icon-tile ${size} ${tint}`}>
    <Icon name={icon} s={s || (size === 'lg' ? 26 : size === 'sm' ? 19 : 22)} sw={2} />
  </div>
);

const Badge = ({ children, tone = '', icon }) => (
  <span className={`badge ${tone}`}>{icon && <Icon name={icon} s={14} sw={2.4} />}{children}</span>
);

const Btn = ({ variant = 'primary', size = '', icon, iconR, children, className = '', ...p }) => (
  <button className={`btn btn-${variant} ${size} ${className}`} {...p}>
    {icon && <Icon name={icon} s={size === 'sm' ? 16 : 18} sw={2.2} />}
    {children}
    {iconR && <Icon name={iconR} s={size === 'sm' ? 16 : 18} sw={2.2} />}
  </button>
);

const Avatar = ({ name = 'АК', sm }) => (
  <div className={`avatar ${sm ? 'sm' : ''}`}>{name}</div>
);

const Progress = ({ pct, color = 'var(--accent-2)', h = 9 }) => (
  <div className="track" style={{ height: h }}>
    <div className="fill" style={{ width: `${pct}%`, background: color }} />
  </div>
);

const StatusPill = ({ status }) => {
  const s = STATUS[status];
  return <span className="status" style={{ color: s.color }}><span className="dot" style={{ background: s.color }} />{s.label}</span>;
};

// A ring / donut progress using conic-gradient
const Ring = ({ pct, size = 92, color = 'var(--accent-2)', track = 'var(--surface-inset)', children }) => (
  <div style={{ width: size, height: size, borderRadius: '50%', display: 'grid', placeItems: 'center',
    background: `conic-gradient(${color} ${pct * 3.6}deg, ${track} 0)` }}>
    <div style={{ width: size - 18, height: size - 18, borderRadius: '50%', background: 'var(--surface)',
      display: 'grid', placeItems: 'center', textAlign: 'center' }}>{children}</div>
  </div>
);

// striped image placeholder
const Placeholder = ({ label = 'превью документа', h = 180, r = 'var(--r-md)' }) => (
  <div style={{ height: h, borderRadius: r, display: 'grid', placeItems: 'center',
    background: 'repeating-linear-gradient(135deg, var(--surface-inset) 0 12px, var(--surface-2) 12px 24px)',
    border: '1px solid var(--line)', color: 'var(--muted)' }}>
    <span style={{ fontFamily: 'ui-monospace, monospace', fontSize: 12, letterSpacing: '.04em' }}>{label}</span>
  </div>
);

const Modal = ({ onClose, children, wide }) => {
  useEffect(() => {
    const h = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={wide ? { width: 'min(720px, 100%)' } : null} onClick={(e) => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
};

Object.assign(window, { Card, SectionLabel, IconTile, Badge, Btn, Avatar, Progress, StatusPill, Ring, Placeholder, Modal });

</script>

const { useState } = React;

function UploadModal({ onClose }) {

    setPhase('uploading');

      p += Math.random() * 22 + 8;

    <Modal onClose={onClose}>

        </div>

        {phase === 'pick' && (
          <>
            <div className={`dropzone ${drag ? 'drag' : ''}`} onClick={start}
              onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={(e) => { e.preventDefault(); setDrag(false); start(); }}>

      <Card>

            { icon: 'scan', t: 'Авто-анализ при загрузке', s: 'Запускать ИИ сразу после загрузки', on: auto, set: () => setAuto(!auto) },
          ].map((r) => (
            <div className="lrow" key={r.t}>
              <span className="icon-tile sm" style={{ width: 38, height: 38 }}><Icon name={r.icon} s={19} /></span>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700 }}>{r.t}</div>
                <div style={{ fontSize: 12.5, color: 'var(--muted)' }}>{r.s}</div>
              </div>
              <Toggle on={r.on} onClick={r.set} />

          ))}
        </div>
      </Card>

      <Card style={{ display: 'flex', alignItems: 'center', gap: 14, background: 'var(--brand-grad)', border: 'none', color: 'white', position: 'relative', overflow: 'hidden' }}>
        <div className="blob" style={{ position: 'absolute', width: 160, height: 160, borderRadius: '50%', background: 'rgba(255,255,255,.12)', top: -80, right: -20 }} />
        <div className="frost" style={{ position: 'relative' }}><Icon name="sparkles" s={26} /></div>
        <div style={{ position: 'relative', flex: 1 }}>
          <div className="display" style={{ fontSize: 18, fontWeight: 800 }}>Тариф Pro</div>
          <div style={{ color: 'var(--on-grad)', fontSize: 13.5 }}>Безлимитный ИИ-анализ и расширенная аналитика</div>
        </div>
        <button className="btn" style={{ position: 'relative', background: 'white', color: 'var(--brand-ink)' }}>Управление</button>
      </Card>

      <button className="btn btn-ghost" style={{ alignSelf: 'flex-start', color: 'var(--red)' }}><Icon name="logout" s={18} /> Выйти из аккаунта</button>
    </div>
  );
}

/* ---------------- Авторизация ---------------- */
function AuthScreen({ onLogin }) {
  const [email, setEmail] = useState('alexey@orbita.ru');
  const [pwd, setPwd] = useState('••••••••');
  return (
    <div style={{ minHeight: '100vh', display: 'grid', gridTemplateColumns: '1.05fr 1fr', background: 'var(--bg)' }}>
      {/* brand panel */}
      <div className="auth-brand" style={{ background: 'var(--brand-grad)', color: 'white', padding: 56, position: 'relative', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div className="blob" style={{ position: 'absolute', width: 360, height: 360, borderRadius: '50%', background: 'rgba(255,255,255,.10)', top: -120, right: -80 }} />

          <div style={{ display: 'flex', gap: 26, marginTop: 36 }}>

              <div key={l}>

      {/* form */}

              <span>Email</span>

            <label className="field">

}

Object.assign(window, { PlansScreen, SettingsScreen, AuthScreen });

</script>
<script type="text/babel" data-file="app.jsx">
/* app.jsx — shell: sidebar, topbar, router, tweaks */
const { useState: useS, useEffect: useE } = React;

const ACCENTS = {
  violet:  ['#7C3AED', '#9333EA', '#C026D3'],
  indigo:  ['#4F46E5', '#6366F1', '#8B5CF6'],
  blue:    ['#2563EB', '#3B82F6', '#06B6D4'],
  emerald: ['#0D9488', '#10B981', '#22C55E'],
  sunset:  ['#DB2777', '#E11D48', '#F97316'],
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "violet",
  "density": "comfortable"
}/*EDITMODE-END*/;

function Sidebar({ route, go, open, setOpen }) {
  return (
    <>
      {open && <div className="scrim" onClick={() => setOpen(false)} />}
      <aside className={`sidebar ${open ? 'open' : ''}`}>
        <div className="brand">
          <div className="brand-mark"><Icon name="bulb" s={22} /></div>
          <div>
            <div className="brand-name">ИИ-Консультант</div>
            <div className="brand-sub">Premium</div>
          </div>
        </div>
        <div className="nav-label">Меню</div>
        {NAV.map((n) => (
          <button key={n.key} className={`nav-item ${route === n.key || (route === 'docdetail' && n.key === 'documents') ? 'active' : ''}`}
            onClick={() => { go(n.key); setOpen(false); }}>
            <span className="nav-ico"><Icon name={n.icon} s={20} /></span>
            {n.label}
            {n.dot && <span className="badge amber" style={{ marginLeft: 'auto', padding: '3px 9px', fontSize: 11.5 }}>{n.dot}</span>}
          </button>
        ))}
        <div className="side-user" onClick={() => { go('settings'); setOpen(false); }}>
          <Avatar name="АК" />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Алексей Климов</div>
            <div style={{ fontSize: 12, color: 'var(--muted)' }}>ООО «Орбита»</div>
          </div>
          <Icon name="gear" s={17} style={{ color: 'var(--muted)' }} />
        </div>
      </aside>
    </>
  );
}

const TITLES = {
  overview: ['Обзор', 'Главная панель бизнеса'],
  insights: ['Инсайты', 'ИИ-рекомендации'],
  documents: ['Документы', 'Хранилище и анализ'],
  docdetail: ['Документ', 'Результаты анализа'],
  plans: ['Планы', 'Цели и задачи'],
  settings: ['Настройки', 'Профиль и предпочтения'],
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [authed, setAuthed] = useS(false);
  const [route, setRoute] = useS('overview');
  const [menuOpen, setMenuOpen] = useS(false);
  const [upload, setUpload] = useS(false);
  const [doc, setDoc] = useS(null);

  const theme = t.theme;
  const setTheme = (v) => setTweak('theme', v);

  // apply theme tokens
  useE(() => {
    const r = document.documentElement;
    r.setAttribute('data-theme', t.theme);
    r.setAttribute('data-density', t.density);
    const a = ACCENTS[t.accent] || ACCENTS.violet;
    r.style.setProperty('--accent-1', a[0]);
    r.style.setProperty('--accent-2', a[1]);
    r.style.setProperty('--accent-3', a[2]);
  }, [t.theme, t.accent, t.density]);

  const go = (r) => { setDoc(null); setRoute(r); window.scrollTo({ top: 0 }); };
  const openDoc = (d) => { setDoc(d); setRoute('docdetail'); window.scrollTo({ top: 0 }); };

  const panel = (
    <TweaksPanel>
      <TweakSection label="Тема" />
      <TweakRadio label="Оформление" value={t.theme} options={['light', 'dark']} onChange={(v) => setTweak('theme', v)} />
      <TweakSection label="Акцент" />
      <TweakColor label="Цвет бренда" value={ACCENTS[t.accent][1]}
        options={Object.values(ACCENTS).map((a) => a[1])}
        onChange={(v) => { const key = Object.keys(ACCENTS).find((k) => ACCENTS[k][1] === v) || 'violet'; setTweak('accent', key); }} />
      <TweakSection label="Плотность" />
      <TweakRadio label="Интерфейс" value={t.density} options={['comfortable', 'compact']} onChange={(v) => setTweak('density', v)} />
    </TweaksPanel>
  );

  if (!authed) {
    return <><AuthScreen onLogin={() => setAuthed(true)} />{panel}</>;
  }

  const [title, sub] = TITLES[route];

  return (
    <div className="app-shell">
      <Sidebar route={route} go={go} open={menuOpen} setOpen={setMenuOpen} />
      <div className="main">
        <header className="topbar">
          <button className="btn icon btn-ghost menu-btn" onClick={() => setMenuOpen(true)}><Icon name="menu" s={20} /></button>
          <div>
            <div className="page-title">{title}</div>
            <div className="page-sub hide-sm">{sub}</div>
          </div>
          <div className="search hide-sm" style={{ marginLeft: 'auto' }}>
            <Icon name="search" s={18} />
            <input placeholder="Поиск документов, инсайтов…" />
          </div>
          <button className="btn icon btn-ghost" style={{ position: 'relative' }}>
            <Icon name="bell" s={19} />
            <span style={{ position: 'absolute', top: 7, right: 7, width: 8, height: 8, borderRadius: '50%', background: 'var(--red)', border: '2px solid var(--surface)' }} />
          </button>
          <Btn icon="upload" className="hide-sm" onClick={() => setUpload(true)}>Загрузить</Btn>
        </header>

        <div className="content scroll">
          {route === 'overview' && <OverviewScreen go={go} />}
          {route === 'insights' && <InsightsScreen />}
          {route === 'documents' && <DocumentsScreen openUpload={() => setUpload(true)} openDoc={openDoc} />}
          {route === 'docdetail' && doc && <DocumentDetail doc={doc} onBack={() => go('documents')} />}
          {route === 'plans' && <PlansScreen />}
          {route === 'settings' && <SettingsScreen theme={theme} setTheme={setTheme} />}
        </div>
      </div>

      {upload && <UploadModal onClose={() => setUpload(false)} />}
      {panel}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
